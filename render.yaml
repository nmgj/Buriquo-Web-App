databases:
  - name: laravel-postgres-db
    databaseName: laravel
    user: laravel_user
    plan: free
    region: oregon

services:
  - type: web
    name: laravel-app
    env: docker # <-- MUST BE DOCKER (Render has no native PHP runtime)
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: LaravelApp
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: laravel-postgres-db
          property: connectionString
